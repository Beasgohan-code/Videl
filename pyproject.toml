[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videl"
version = "0.1.0"
description = "A small, typed Telegram Bot API toolkit with rich messages and keyboards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Videl contributors" }]
dependencies = []

[project.optional-dependencies]
http = ["aiohttp>=3.9"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
